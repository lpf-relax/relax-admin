name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]  # 当推送到 main 分支时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 部署到 gh-pages 分支需要写入权限

    steps:
      # 1. 检出代码
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # 2. 设置 Node.js (使用你本地的 Node 24)
      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # 明确指定 Node 24
          # 注意：setup-node 本身不管理 pnpm

      # 3. 安装并配置 pnpm (版本与你本地一致)
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4  # 使用最新 v4 版本
        with:
          version: '11'  # 指定与你本地一致的 pnpm 版本

      # 4. 安装依赖 (使用 pnpm)
      - name: Install dependencies 📦
        run: pnpm install --frozen-lockfile  # 严格按 pnpm-lock.yaml 安装

      # 5. 构建项目
      - name: Build 🏗️
        run: pnpm run build  # Ant Design Pro 默认构建命令

      # 6. 部署到 GitHub Pages
      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Ant Design Pro 默认输出目录
