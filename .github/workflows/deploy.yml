name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]  # 当 main 分支有 push 时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限来推送 gh-pages 分支
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install and Build 🔧
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci # 或 npm install
      - run: npm run build # Ant Design Pro 的构建命令

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Ant Design Pro 默认构建输出目录为 dist[citation:8][citation:12]